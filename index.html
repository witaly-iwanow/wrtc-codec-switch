<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WebRTC codec switch</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  video { width: 480px; background: #222; margin-right: 8px; }
  button { margin: 8px 8px 8px 0; }
</style>
</head>
<body>
<video id="local" autoplay playsinline muted></video>
<video id="remote" autoplay playsinline></video>
<div>
  <button id="start">Start</button>
  <button id="toggle" disabled>Switch to AV1</button>
  <span id="stats"></span>
</div>
<p><a href="https://github.com/witaly-iwanow/wrtc-codec-switch" target="_blank">GitHub</a></p>
<script src="main.js"></script>
</body>
</html>
